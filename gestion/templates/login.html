<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión | Sistema Hospitalario</title>
    <style>
        :root { --primary: #007bff; --dark: #2c3e50; --light: #f8f9fa; }
        body { font-family: 'Segoe UI', sans-serif; background: #eef2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 35px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-card h1 { color: var(--dark); font-size: 1.6rem; margin-bottom: 5px; }
        .login-card p { color: #666; font-size: 0.9rem; margin-bottom: 20px; }
        .alert-error { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; border: 1px solid #f5c6cb; font-size: 0.9rem; margin-bottom: 15px; text-align: center; }
        .form-group { margin-bottom: 18px; text-align: left; }
        .form-group label { display: block; margin-bottom: 6px; color: var(--dark); font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; }
        .btn-login { width: 100%; background-color: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>🏥 Portal Hospitalario</h1>
        <p>Acceso restringido al personal no autorizado</p>

        {% if error %}
            <div class="alert-error">⚠️ {{ error }}</div>
        {% endif %}

        <form action="" method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label for="rol">Selecciona tu Rol de Usuario:</label>
                <select name="rol" id="rol" required>
                    <option value="recepcion">📋 Recepcionista</option>
                    <option value="medico">🩺 Médico</option>
                    <option value="enfermeria">💉 Personal de Enfermería</option>
                    <option value="administrador">⚙️ Administrador</option>
                    <option value="soporte">🛠️ Soporte Técnico</option>
                </select>
            </div>

            <div class="form-group">
                <label for="usuario">Usuario:</label>
                <input type="text" id="usuario" name="usuario" placeholder="Ej: admin" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña:</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-login">Ingresar al Sistema 🚀</button>
        </form>
    </div>
</body>
</html>
